<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema — Reporte 40</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Datos del Sistema (Soporte offline / doble clic) -->
  <script src="data/demo_data.js"></script>
</head>
<body>

  <!-- Botón flotante para cambiar tema Claro/Oscuro -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
    <button class="theme-toggle-btn shadow-sm" type="button" aria-label="Cambiar tema">
      <i class="bi bi-moon-stars-fill text-primary"></i> <span>Oscuro</span>
    </button>
  </div>

  <div class="login-container">
    <div class="login-card fade-in">
      <div class="login-header">
        <div class="brand-badge mb-2">
          <i class="bi bi-hospital"></i> RED CUSCO SUR
        </div>
        <h1>Reporte 40</h1>
        <p>Sistema de Consulta y Descarga de Producción Individual</p>
      </div>

      <!-- Alertas -->
      <div id="loginAlert" class="alert-elegant d-none" role="alert"></div>

      <form id="loginForm" autocomplete="off">
        
        <!-- Campo DNI Elegante -->
        <div class="form-group-elegant">
          <label for="dniInput" class="form-label-elegant">
            <i class="bi bi-person-vcard"></i> Número de DNI
          </label>
          <div class="input-container-elegant">
            <span class="input-icon-lead">
              <i class="bi bi-person"></i>
            </span>
            <input 
              type="text" 
              id="dniInput" 
              placeholder="Ingresa tu DNI (8 dígitos)" 
              maxlength="15" 
              required
              autofocus
            >
          </div>
        </div>

        <!-- Campo Contraseña Elegante -->
        <div class="form-group-elegant">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="passwordInput" class="form-label-elegant mb-0">
              <i class="bi bi-shield-lock"></i> Contraseña
            </label>
          </div>
          <div class="input-container-elegant">
            <span class="input-icon-lead">
              <i class="bi bi-key"></i>
            </span>
            <input 
              type="password" 
              id="passwordInput" 
              placeholder="Contraseña inicial = tu DNI" 
              required
            >
            <button 
              class="btn-eye-toggle" 
              type="button" 
              id="togglePasswordBtn"
              title="Mostrar u ocultar contraseña"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="input-hint-elegant">
            <i class="bi bi-info-circle-fill"></i>
            <span>Tu contraseña inicial es tu propio número de DNI.</span>
          </div>
        </div>

        <button type="submit" class="btn-primary-custom w-100 mt-2" id="loginSubmitBtn">
          <span id="btnText"><i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center small text-muted">
        <span>Diseñado para personal de salud</span> • <span class="footer-author">hecho por xzerox99</span>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pwa.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Si ya hay sesión activa, redirigir
      const user = Auth.getCurrentUser();
      if (user) {
        if (Auth.isAdmin()) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "dashboard.html";
        }
        return;
      }

      const loginForm = document.getElementById("loginForm");
      const dniInput = document.getElementById("dniInput");
      const passwordInput = document.getElementById("passwordInput");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const loginAlert = document.getElementById("loginAlert");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const loginSubmitBtn = document.getElementById("loginSubmitBtn");

      // Ver / ocultar contraseña
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
      });

      // Manejo de Login
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const dni = dniInput.value.trim();
        const password = passwordInput.value.trim();

        if (!dni || !password) return;

        loginAlert.className = "alert-elegant d-none";
        loginSubmitBtn.disabled = true;
        btnText.classList.add("d-none");
        btnSpinner.classList.remove("d-none");

        try {
          const res = await Api.callAppsScript("login", { dni, password });

          if (res.success && res.user) {
            Auth.setSession(res.user);
            loginAlert.className = "alert-elegant alert-success-elegant fade-in";
            loginAlert.innerHTML = `<i class="bi bi-check-circle-fill"></i> <span>¡Bienvenido(a), ${res.user.nombre}! Redirigiendo...</span>`;

            setTimeout(() => {
              if (res.user.rol === "admin" || res.user.dni === CONFIG.ADMIN_DEFAULT_DNI) {
                window.location.href = "admin.html";
              } else {
                window.location.href = "dashboard.html";
              }
            }, 600);
          } else {
            loginAlert.className = "alert-elegant alert-danger-elegant fade-in";
            loginAlert.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> <span>${res.message || "Credenciales incorrectas"}</span>`;
            loginSubmitBtn.disabled = false;
            btnText.classList.remove("d-none");
            btnSpinner.classList.add("d-none");
          }
        } catch (err) {
          loginAlert.className = "alert-elegant alert-danger-elegant fade-in";
          loginAlert.innerHTML = `<i class="bi bi-exclamation-octagon-fill"></i> <span>Error al conectar con el servidor. Intenta de nuevo.</span>`;
          loginSubmitBtn.disabled = false;
          btnText.classList.remove("d-none");
          btnSpinner.classList.add("d-none");
        }
      });
    });
  </script>
</body>
</html>
